<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{layout/layout :: heat}"></head>
    <body>
        <header th:replace="~{layout/layout :: header}"></header>
        <aside th:replace="~{layout/layout :: aside}"></aside>

        <main class="container-fluid">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                <div>
                    <h3 class="form-title mb-1">Auditoría de comprobantes</h3>
                    <p class="text-muted mb-0">Historial fiscal de solo lectura de la sucursal.</p>
                </div>
                <a class="btn btn-outline-secondary" th:href="@{/comprobantes-v2}">
                    <i class="fa-solid fa-arrow-left"></i> Volver a comprobantes
                </a>
            </div>

            <section class="card border-0 shadow-sm p-3 mb-3">
                <div class="row g-2 align-items-end">
                    <div class="col-md-3">
                        <label class="form-label" for="numero">Número de comprobante</label>
                        <input class="form-control" id="fNumeroAuditoria" type="number" min="1" placeholder="Nro. comprobante">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="accion">Acción</label>
                        <select class="form-select" id="fAccionAuditoria">
                            <option value="">Todas</option>
                            <option th:each="opcion : ${acciones}" th:value="${opcion}"
                                    th:text="${opcion}"></option>
                        </select>
                    </div>
                    <div class="col-md-5 d-flex gap-2">
                        <button class="btn btn-primary" id="filtrarAuditoria" type="button"><i class="fa-solid fa-filter"></i> Filtrar</button>
                        <button class="btn btn-outline-secondary" id="limpiarAuditoria" type="button">Limpiar</button>
                    </div>
                </div>
            </section>

            <div class="card border-0 shadow-sm p-3 table-responsive">
                <table id="tablaAuditoriaComprobantes" class="table table-striped table-hover align-middle small w-100">
                    <thead><tr><th>Fecha</th><th>Acción</th><th>Documento</th><th>Timbrado</th><th>Serie</th><th>Usuario</th><th>Motivo</th></tr></thead>
                </table>
            </div>
        </main>
        <footer th:replace="~{layout/layout :: footer}"></footer>
        <script src="/js/comprobantesv2/auditoria.js"></script>
    </body>
</html>
