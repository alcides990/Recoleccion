<html xmlns:th="http://www.thymeleaf.org"
      xmlns="http://www.w3.org/1999/xhtmal" >
    <head>
        <title>Datos de la Persona</title>
        <meta http-equiv="Content-type" content="text/html charset=UTF-8">
            <head  th:replace="~{layout/layout :: heat}"> </head>

            <body>
                <header  th:replace="~{layout/layout :: header}"> </header>
                <aside  th:replace="~{layout/layout :: aside}"> </aside>
                <div class="container">

                    <h3 class="form-title">Datos de Ciudad</h3>
                    <a th:href="@{/ciudad/listar}" class="btn btn-primario m-2"> Regresar </a>
                    <div class="contenedor">
                        <form   th:action="@{/ciudad/guardar}" id="formulario" method="post" th:object="${ciudad}" >
                            <div class=" row m-2">
                                <input type="hidden" name="codigoCiudad" id="codigoCiudad" th:value="*{codigoCiudad}" />

                                <label class="form-label m-2 col-md-1" for="ciudad">Ciudad:</label>
                                <input class="form-control col" type="text" name="nombreCiudad" id="ciudad"  th:value="*{nombreCiudad}"   placeholder="Igrese nombre de la de la ciudad" />
                            </div>

                            <input type="submit" name="guardar" value="Guardar" class="btn-primario m-2"/>
                        </form>
                    </div>
                </div>
                <footer  th:replace="~{layout/layout :: footer}"> </footer>
            </body>
            </html>
