<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <head  th:replace="~{layout/layout :: heat}"> </head>
    <body>
        <header  th:replace="~{layout/layout :: header}"> </header>
        <aside th:replace="~{layout/layout :: aside}">  </aside>
        <div class="container-fluid"> 
            <div class="card-header"> <h3>Estado Cuenta</h3></div>
            <form name=" frm-servicio" id="frm-servicio" th:action="@{/servicio/guardar}" method="post" th:object="${servicio}">
                <a th:href="@{/servicio/listar}" class="btn btn-primario">Regresar</a>
                <div class="form-group">
                    <div class="row">
                        <div class="col-sm-3"> 
                            <label for="cuentaCorriente">CuentaCorriente  </label>
                            <select th:object="${servicio}" class="form-control" name="cuentaCorriente" id="cuentaCorriente" >
                                <option th:each="cuenta : ${cuentas}" 
                                        th:value="${cuenta}"
                                        th:text="${cuenta}" 
                                        th:selected="${cuenta}== ${servicio.cuentaCorriente}"/>
                            </select>
                        </div>

                        <div class="col-sm-5"> 
                            <label for="categoria">Categoria</label>
                            <select th:object="${categoria}" class="form-control" name="categoria" >
                                <option th:each="categoria : ${categoria}" 
                                        th:value="${categoria.codigoCategoria}"
                                        th:text="${categoria.nombreCategoria}+' '+${categoria.tarifa} "
                                        th:selected="${categoria}== ${servicio.categoria}"/>
                            </select>

                        </div>

                        <div class="col-sm-3">
                            <label for="fechaInicio"> Fecha Inicio   </label>
                            <input type="text" readonly="true"  name="fechaInicio" id="fechaInicio" th:value="*{fechaInicio}" class="form-control"  required="campo ogligatorio"  />
                        </div>

                    </div>

                    <div class="row">
                        <div>
                            <input type="text" hidden="true" name="codigoUsuario" id="codigoUsuario" th:field="${servicio.usuario.codigoUsuario}">
                        </div>
                        <div class="col-sm-3">
                            <label for="numeroDocumento">RUC </label>
                            <input type="text" id="numeroDocumento" name="numeroDocumento" disabled="true" class="form-control "  th:value="${servicio.usuario.numeroDocumento}"  required="campo ogligatorio"/>
                        </div>
                        <div class="col">
                            <label for="buscarUsuario">Usuario </label>
                            <input  type="text" disabled="true" name="buscarUsuario" id="buscarUsuario" th:value="${servicio.usuario.nombre}+' '+${servicio.usuario.nombre}"  class="form-control"  required="campo ogligatorio"/>
                        </div>


                        <div class="col-sm-2"> 
                            <label for="estado">Estado</label>
                            <select th:object="${estado}" class="form-control" name="estado" >
                                <option th:each="estado : ${estado} " 
                                        th:value="${estado.codigoEstado}"
                                        th:text="${estado.estado}"  />
                            </select>
                        </div>
                    </div>
                </div>
            </form>
            <hr>
                <div class="row">

                    <div class="col-md-4 mb-3"> 
                        <div class="estadoCuenta  my-1 "> 
                            <h5 class="text-center">Estado de Cuenta</h5>

                            <div class="row">
                                <div class="col-4 my-1">
                                    <label  for="pagoHasta">Pago Hasta:</label>
                                </div>
                                <div class="col my-1">
                                    <input  type="text" disabled="true" name="pagoHasta" id="pagoHasta" th:value="${#temporals.format(estadoCuenta.pagoHasta,'dd-MM-yyyy')}" class="form-control"  />
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-4  my-1">
                                    <label  for="cantidadPeriodo">Cant. Deuda:</label>
                                </div>
                                <div class="col"  my-1>
                                    <input  type="text" disabled="true" name="cantidadPeriodo" id="cantidadPeriodo" th:field="${estadoCuenta.cantidadDeuda}"   class="form-control"  />
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-4 my-1">
                                    <label for="subTotal">SubTotal:</label>
                                </div>
                                <div class="col my-1">
                                    <input  type="text" disabled="true" name="subTotal" id="subTotal"  th:value="${#numbers.formatDecimal(estadoCuenta.subTotal, 0, 'COMMA', 0, 'POINT')}"  class="form-control"  />
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-4 my-1">
                                    <label  for="saldo">Saldo</label>
                                </div>
                                <div class="col my-1">
                                    <input  type="text" disabled="true" name="recargo" id="saldo" th:value="${#numbers.formatDecimal(estadoCuenta.saldoAnterior, 0, 'COMMA', 0, 'POINT')}"   class="form-control"  />
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-4 my-1">
                                    <label  for="recargo">Recargo:</label>
                                </div>
                                <div class="col my-1">
                                    <input  type="text" disabled="true" name="recargo" id="recargo" th:value="${#numbers.formatDecimal(estadoCuenta.recargo, 0, 'COMMA', 0, 'POINT')}"   class="form-control"  />
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-4 my-1">
                                    <label  for="totalDeuda">Total:</label>
                                </div>
                                <div class="col my-1">
                                    <input  type="text" disabled="true" name="totalDeuda" id="totalDeuda"  th:value="${#numbers.formatDecimal(estadoCuenta.totalDeuda, 0, 'COMMA', 0, 'POINT')}"  class="form-control"  />
                                </div>
                            </div>

                        </div>
                    </div>
                    <div class=" col-md-12 col-lg-8"> 
                        <div class="table-responsive-xxl">
                            <table id="tabla" class="table table-responsive-xxl table-dark table-border table-striped  table-hover small" >
                                <thead class="sticky-top">
                                    <tr>
                                        <th>Tipo</th>
                                        <th>Nro.Factura</th>
                                        <th>FechaPago</th>
                                        <th>PeriodoPago</th>
                                        <th>Tarifa</th>
                                        <th>Cant.Pago</th>
                                        <th>Recargo</th>
                                        <th>Importe</th>
                                        <th>Estado</th>
                                    </tr>
                                </thead>
                                <tbody class="table-secondary"  >
                                    <tr  th:each="comprobante : ${comprobantes}"> 
                                        <td th:text="${comprobante.tipoFactura.tipoFactura}" > </td>
                                        <td th:text="${comprobante.puntoExpedicion.sucursal.nombreSucursal}+'-'+ ${comprobante.puntoExpedicion.nombrePuntoExpedicion}+'-'+ ${comprobante.comprobantePK.numeroComprobante}"> </td>
                                        <!--<td th:text="${comprobante.servicio.cuentaCorriente}"> </td>-->
                                        <!--<td th:text="${comprobante.usuario.nombre}+' '+ ${comprobante.usuario.apellido}" >   </td>-->
                                        <td th:text="${#dates.format(comprobante.fechaPago,'yyyy-MM-dd')}"></td>
                                        <td th:text="${comprobante.detalleComprobante.periodoPago}"></td>
                                        <td th:text="${#numbers.formatDecimal(comprobante.detalleComprobante.tarifa, 0, 'POINT', 0, 'COMMA')}"></td>
                                        <td th:text="${comprobante.cantidadPago}"></td>
                                        <td th:text="${#numbers.formatDecimal(comprobante.detalleComprobante.recargo, 0, 'POINT', 0, 'COMMA')}"></td>
                                        <td th:text="${#numbers.formatDecimal(comprobante.totalImporte, 0, 'COMMA', 0, 'POINT')}"></td>
                                        <td th:text="${estado.estado}"></td>
                                    </tr>
                                </tbody>
                            </table>
                            <nav  th:replace="~{layout/paginador :: paginador}"> </nav>
                        </div>
                    </div>
                </div>
        </div>

        <footer  th:replace="~{layout/layout :: footer}"> </footer>
        <script src="/js/buscarUsuario.js"></script>
        <script src="/js/estadoCuenta.js"></script>
        <script>
            $("#cantidadRegistro").change(function () {
                var cantidadRegistro = $(this).val();
                var url = new URL(window.location.href);
                var searchParams = new URLSearchParams(url.search);
                searchParams.set('page', 0);
                searchParams.set('cantidadRegistro', cantidadRegistro);
                url.search = searchParams.toString();
                window.location.href = url;
            }
            );
        </script>

    </body>

</html>
