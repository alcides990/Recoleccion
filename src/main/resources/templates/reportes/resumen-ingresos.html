<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{layout/layout :: heat}"></head>
    <link rel="stylesheet" th:href="@{/css/reportes/formulario.css}">
    <link rel="stylesheet" th:href="@{/css/reportes/resumen-ingresos.css}">
    <body>
        <header th:replace="~{layout/layout :: header}"></header>
        <aside th:replace="~{layout/layout :: aside}"></aside>
        <main id="resumenIngresos" class="container-fluid">
            <div class="card-header"><h3 class="form-title">Resumen de ingresos</h3></div>
            <section class="resumen-filtros">
                <div class="row g-3 align-items-end">
                    <div class="col-md-4"><label for="resumenDesde">Desde</label><input id="resumenDesde" class="form-control" type="text" autocomplete="off"></div>
                    <div class="col-md-4"><label for="resumenHasta">Hasta</label><input id="resumenHasta" class="form-control" type="text" autocomplete="off"></div>
                    <div class="col-md-4 d-grid"><button id="consultarResumenIngresos" class="btn resumen-consultar" type="button"><i class="fa-solid fa-magnifying-glass"></i> Consultar</button></div>
                </div>
            </section>
            <div id="mensajeResumenIngresos" class="mt-3"></div>
            <section class="row g-3 my-1">
                <div class="col-md-6"><article class="resumen-metrica"><span>Total ingresado</span><strong id="resumenTotal">Gs. 0</strong></article></div>
                <div class="col-md-6"><article class="resumen-metrica"><span>Comprobantes</span><strong id="resumenCantidad">0</strong></article></div>
            </section>
            <section class="row g-3">
                <div class="col-lg-6"><article class="resumen-tabla-card"><h4>Ingresos por cobrador</h4><div class="table-responsive"><table class="table table-striped align-middle mb-0"><thead><tr><th>Cobrador</th><th>Comprobantes</th><th>Importe</th></tr></thead><tbody id="resumenPorCobrador"></tbody></table></div></article></div>
                <div class="col-lg-6 d-flex flex-column gap-3">
                    <article class="resumen-tabla-card"><h4>Detalle por cobrador y medio de pago</h4><div class="table-responsive"><table class="table table-striped align-middle mb-0"><thead><tr><th>Cobrador / medio</th><th>Operaciones</th><th>Importe</th></tr></thead><tbody id="detalleCobradorMedio"></tbody></table></div></article>
                    <article class="resumen-tabla-card"><h4>Total general por medio de pago</h4><div class="table-responsive"><table class="table table-striped align-middle mb-0"><thead><tr><th>Medio de pago</th><th>Operaciones</th><th>Importe total</th></tr></thead><tbody id="resumenGeneralPorMedio"></tbody><tfoot><tr class="resumen-total-general"><td>Total general</td><td id="cantidadGeneralPorMedio">0</td><td id="importeGeneralPorMedio" class="text-end">Gs. 0</td></tr></tfoot></table></div></article>
                </div>
            </section>
        </main>
        <footer th:replace="~{layout/layout :: footer}"></footer>
        <script type="module">
            import {datePickerInit} from '/js/modulos.js';
            datePickerInit($('#resumenDesde')); datePickerInit($('#resumenHasta'));
        </script>
        <script src="/js/reportes/resumen-ingresos.js"></script>
    </body>
</html>
