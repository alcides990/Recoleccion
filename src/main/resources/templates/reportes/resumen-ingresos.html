<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{layout/layout :: heat}"></head>
    <link rel="stylesheet" th:href="@{/css/reportes/formulario.css}">
    <link rel="stylesheet" th:href="@{/css/reportes/resumen-ingresos.css}">
    <body>
        <header th:replace="~{layout/layout :: header}"></header>
        <aside th:replace="~{layout/layout :: aside}"></aside>
        <main id="resumenIngresos" class="container-fluid">
            <div class="card-header"><h3 class="form-title">Resumen de ingresos</h3></div>
            <section class="resumen-filtros">
                <div class="row g-3 align-items-end">
                    <div class="col-md-4"><label for="resumenDesde">Desde</label><input id="resumenDesde" class="form-control" type="text" autocomplete="off"></div>
                    <div class="col-md-4"><label for="resumenHasta">Hasta</label><input id="resumenHasta" class="form-control" type="text" autocomplete="off"></div>
                    <div class="col-md-4 d-grid"><button id="consultarResumenIngresos" class="btn resumen-consultar" type="button"><i class="fa-solid fa-magnifying-glass"></i> Consultar</button></div>
                </div>
            </section>
            <div id="mensajeResumenIngresos" class="mt-3"></div>

            <section class="row g-2 mt-0 resumen-columnas">
                <div class="col-lg-5">
                    <article class="resumen-card">
                        <h4>Ingresos por cobrador</h4>
                        <div id="resumenPorCobrador" class="resumen-lista"></div>
                        <div class="resumen-total-cobrador">
                            <span>Total</span>
                            <strong id="resumenCantidad">0</strong>
                            <strong id="resumenTotal">Gs. 0</strong>
                        </div>
                    </article>
                </div>
                <div class="col-lg-7">
                    <article class="resumen-card">
                        <h4>Detalle por cobrador y medio de pago</h4>
                        <div id="detalleCobradorMedio" class="resumen-lista resumen-lista-detalle"></div>
                        <h5 class="resumen-subtitulo-card">Total ingresado por medio de pago</h5>
                        <div class="resumen-encabezado-linea">
                            <span>Medio de pago</span>
                            <span>Cant.</span>
                            <span>Monto</span>
                        </div>
                        <div id="resumenGeneralPorMedio" class="resumen-medios-lista"></div>
                        <div class="resumen-total-general">
                            <span>Total general</span>
                            <strong id="cantidadGeneralPorMedio">0</strong>
                            <strong id="importeGeneralPorMedio">Gs. 0</strong>
                        </div>
                    </article>

                </div>
            </section>
           
        </main>
        <footer th:replace="~{layout/layout :: footer}"></footer>
        <script type="module">
            import {datePickerInit} from '/js/modulos.js';
            datePickerInit($('#resumenDesde'));
            datePickerInit($('#resumenHasta'));
        </script>
        <script src="/js/reportes/resumen-ingresos.js"></script>
    </body>
</html>
