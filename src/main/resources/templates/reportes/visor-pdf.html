<!DOCTYPE html>
<html>
<head>
  <title>Visor de PDF</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
</head>
<body>
  <canvas id="pdf-canvas"></canvas>

  <script>
    // Obtener el elemento canvas
    var canvas = document.getElementById('pdf-canvas');

    // Realizar la solicitud AJAX para obtener el archivo PDF
    $.ajax({
      url: 'ruta_del_archivo.pdf',
      method: 'GET',
      xhrFields: {
        responseType: 'blob'
      },
      success: function(response) {
        // Cargar el archivo PDF
        PDFJS.getDocument(response).promise.then(function(pdf) {
          // Obtener la primera página del PDF
          return pdf.getPage(1);
        }).then(function(page) {
          // Configurar el lienzo para mostrar la página
          var viewport = page.getViewport({ scale: 1 });
          canvas.width = viewport.width;
          canvas.height = viewport.height;

          // Renderizar la página en el lienzo
          page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport });
        }).catch(function(error) {
          console.error('Error al cargar el archivo PDF:', error);
        });
      },
      error: function(xhr, status, error) {
        console.error('Error al obtener el archivo PDF:', error);
      }
    });
  </script>
</body>
</html>
