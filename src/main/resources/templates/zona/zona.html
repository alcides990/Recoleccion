<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{layout/layout :: heat}"></head>
    <link rel="stylesheet" href="/css/zona/formulario.css">
    <body>
        <header th:replace="~{layout/layout :: header}"></header>
        <aside th:replace="~{layout/layout :: aside}"></aside>

        <main id="listaZonas" class="container-fluid py-3">
            <section class="zona-list-header">
                <div>
                    <span class="zona-list-kicker">Organización territorial</span>
                    <h3>Zonas</h3>
                    <p>Administre las zonas, cobradores y manzanas de su sucursal.</p>
                </div>
                <a th:href="@{/zona/agregar}" class="btn zona-list-agregar">
                    <i class="fa-solid fa-plus"></i> Agregar zona
                </a>
            </section>

            <div id="contenedor-alertas" class="mensaje-alerta mt-3" aria-live="polite"></div>
            <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show mt-3" role="alert">
                <i class="fa-solid fa-circle-check me-1"></i>
                <span th:text="${mensaje}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
            </div>

            <section class="zona-list-card">
                <div class="zona-list-summary">
                    <div>
                        <h4>Zonas registradas</h4>
                        <p>La tabla contiene únicamente registros de su sucursal.</p>
                    </div>
                    <span id="zonaTotal" class="badge zona-list-count">0</span>
                </div>
                <div class="table-responsive">
                    <table id="tablaZonas" class="table table-striped table-hover align-middle w-100">
                        <thead>
                            <tr>
                                <th>Sucursal - Ciudad</th>
                                <th>Zona</th>
                                <th>Cobrador</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                    </table>
                </div>
            </section>
        </main>

        <footer th:replace="~{layout/layout :: footer}"></footer>
        <script src="/js/zona/tabla.js"></script>
        <script type="module">
            import {eliminar} from '/js/modulos.js';
            eliminar('¿Seguro que desea eliminar esta zona?');
        </script>
    </body>
</html>
