<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml" 
      xmlns:th="http://www.thymeleaf.org">
    <head  th:replace="~{layout/layout :: heat}"> </head>

    <body>
        <header  th:replace="~{layout/layout :: header}"> </header>
        <aside  th:replace="~{layout/layout :: aside}"> </aside>
        <div th:replace="~{layout/layout :: modal}"> </div>
        <div class="container">
            <div class="card-header"><h3>Zona</h3></div> 
            <div class="mensaje-alerta" id="contenedor-alertas"></div>
            <a th:href="@{/zona/agregar}" 
               class="btn btn-primario btn-sm mb-2 ">
                <i class="fa-solid fa-plus fa-lg "> </i> zona
            </a>
            <div class="mensaje-alerta"id="contenedor-alertas" ></div>
            <div th:if="${mensaje}" class="mensaje-alerta alert alert-success">
                <span th:text="${mensaje}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div class="table-responsive-md">
                <table id="tabla" class="table table-dark table-border table-striped table-colapse table-hover table-md " >
                    <thead class="thead-dark">
                        <tr>
                            <th>Codigo</th>
                            <th>Zona</th>
                            <th>Sucursal</th>
                            <th>Ciudad</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody class="table-secondary">
                        <tr th:each="zona : ${zonas}">
                            <td th:text="${zona.codigoZona}">  </td>
                            <td th:text="${zona.nombreZona}">   </td>
                            <td th:text="${zona.sucursal.nombreSucursal}">   </td>
                            <td th:text="${zona.sucursal.ciudad.nombreCiudad}">   </td>
                            <td>
                                <a th:href="@{/detalleZona/agregar/} + ${zona.codigoZona}"
                                   class="btn btn-primario btn-sm"
                                   title="Asignar Cobrador">
                                    <i class="fas fa-user-plus"></i> 
                                </a>
                                <a th:href="@{/zona/editar/} + ${zona.codigoZona}"
                                   class="btn btn-info btn-sm"
                                   title="Editar Zona">
                                    <i class="fa-regular fa-pen-to-square"></i> 
                                </a>
                                <a id="eliminar" data-url="/zona/eliminar/" th:data-id="${zona.codigoZona}" 
                                   class="btn btn-danger eliminar btn-sm"
                                   title="Eliminar Zona">
                                    <i class="fa-solid fa-trash-can"></i> 
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
        <footer  th:replace="~{layout/layout :: footer}"> </footer>

        <script>
            $(document).ready(function () {
//            Lamara al metodo eliminar al hacer click en el boton eliminar
                eliminar();
//                Cargar idioma español a la tabla paginado con Jquerry data
                $('#tabla').DataTable({
                    language: {
                        url: '/i18n/es-ES.json'
                    }
                });
            });
        </script>
    </body>

</html>
