<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml" 
      xmlns:th="http://www.thymeleaf.org">
    <head  th:replace="~{layout/layout :: heat}"> </head>
    <body>
        <header  th:replace="~{layout/layout :: header}"> </header>
        <aside  th:replace="~{layout/layout :: aside}"> </aside>
        <div class="container card ">
            <div><h4>Puntos de expedicion</h4></div> 
            <div class="">
                <a th:href="@{/puntoExpedicion/agregar}" class="btn btn-primary btn-sm mb-3">Agregar PuntoExpedicion</a>
                <div class="table-responsive-sm">
                    <table class="table table-border table-striped table-colapse table-hover table-lg " >
                        <thead class="table-dark">
                            <tr>
                                <th>Codigo PuntoExpedicion</th>
                                <th>PuntoExpedicion</th>
                                <th>Sucursal</th>
                                <th>Estado</th>
                                <th>Editar</th>
                                <th>Eliminar</th>
                            </tr>
                        </thead>
                        <tbody class="table-secondary">
                            <tr th:each="puntoExpedicion : ${puntosExpedicion}">
                                <td th:text="${puntoExpedicion.codigoPuntoExpedicion}">  </td>
                                <td th:text="${puntoExpedicion.nombrePuntoExpedicion}">   </td>
                                <td th:text="${puntoExpedicion.sucursal.nombreSucursal}" >   </td>
                                <td th:text="${puntoExpedicion.estado.estado}" >   </td>
                                <td><a th:href="@{/puntoExpedicion/editar/} + ${puntoExpedicion.codigoPuntoExpedicion}" class="btn btn-info btn-sm"th:text="Editar"/></td>
                                <td><a th:href="@{/puntoExpedicion/eliminar(codigoPuntoExpedicion=${puntoExpedicion.codigoPuntoExpedicion})}" class="btn btn-danger btn-sm "th:text="Eliminar"/></td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>


        </div>
        <footer  th:replace="~{layout/layout :: footer}"> </footer>
    </body>

</html>
