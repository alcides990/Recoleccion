<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <head>

    </head>
    <body>
        <nav id="paginador" th:fragment="paginador" class="sticky-start">
            <ul class="pagination ">
                <li class="page-item" th:class="${page.first? 'page-item disabled': 'page-item'}">
                    <span class="page-link" th:if="${page.first}">Primera</span>
                    <a class="page-link" th:if="${not page.first}" th:href="@{${page.url}(page=0)}">Primera</a>
                </li>

                <li class="page-item" th:class="${not page.hasPrevious? 'page-item disabled': 'page-item'}">
                    <span class="page-link" th:if="${not page.hasPrevious}">&laquo;</span>
                    <a class="page-link" th:if="${page.hasPrevious}" th:href="@{${page.url}(page=${page.paginaActual-2},cantElemento=${cantElemento})}" >&laquo;</a>
                </li>

                <li class="page-item" th:each="item : ${page.paginas}" th:class="${item.actual? 'page-item active': 'page-item'}">
                    <span class="page-link" th:if="${item.actual}" th:text="${item.numero}"></span>
                    <a class="page-link" th:if="${not item.actual}" th:href="@{${page.url}(page=${item.numero-1},cantElemento=${cantElemento})}" th:text="${item.numero}"></a>
                </li>


                <li class="page-item" th:class="${not page.hasNext? 'page-item disabled': 'page-item'}">
                    <span class="page-link" th:if="${not page.hasNext}">&raquo;</span>
                    <a class="page-link" th:if="${page.hasNext}" th:href="@{${page.url}(page=${page.paginaActual},cantElemento=${cantElemento})}">&raquo;</a>
                </li>

                <li class="page-item" th:class="${page.last? 'page-item disabled': 'page-item'}">
                    <span class="page-link" th:if="${page.last}">&Uacute;ltima</span>
                    <a class="page-link" th:if="${not page.last}" th:href="@{${page.url}(page=${page.totalPaginas-1},cantElemento=${cantElemento})}">&Uacute;ltima</a>
                </li>
                <li class="page-item">

                    <select class="page-link"  id="cantElemento">
                        <option value="10" th:text="10" th:selected="${cantElemento == 10}"></option>
                        <option value="20" th:text="20" th:selected="${cantElemento == 20}"></option>
                        <option value="50" th:text="50" th:selected="${cantElemento == 50}"></option>
                    </select>
                </li>
            </ul>

        </nav>

    </body>
</html>
