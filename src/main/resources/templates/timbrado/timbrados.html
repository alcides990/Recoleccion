<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <head th:replace="~{layout/layout :: heat}"> </head>
    <link rel="stylesheet" href="/css/timbrado/timbrados.css">

    <body>
        <header th:replace="~{layout/layout :: header}"> </header>
        <aside th:replace="~{layout/layout :: aside}"> </aside>

            <main class="container timbrado-page py-3">
                <h3 class="form-title">Timbrados</h3>
                <div class="mensaje-alerta" id="contenedor-alertas"></div>
                <div th:if="${info}" class="mensaje-alerta alert alert-success">
                    <span th:text="${info}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                <div class="d-flex flex-wrap gap-2 m-2">
                    <a id="btn-agregar" class="btn btn-primario" data-bs-toggle="modal" data-bs-target="#frm-modal">
                        <i class="fa-solid fa-plus"></i> Agregar
                    </a>
                    <a sec:authorize="hasAnyAuthority('ROOT','ADMINISTRADOR')" th:href="@{/detalleTimbrado/listar}"
                       class="btn btn-secondary">
                        <i class="fa-solid fa-gears"></i> Configurar puntos y series
                    </a>
                </div>
                <div class="table-responsive-sm">
                    <table class="table table-border table-striped table-colapse table-hover table-lg ">
                        <thead class="bg-color">
                            <tr>
                                <th>CodigoTimbrado</th>
                                <th>NumeroTimbrado</th>
                                <th>VigenciaDesde</th>
                                <th>VigenciaHasta</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody class="table-secondary">
                            <tr th:each="timbrado : ${timbrados}">
                                <td th:text="${timbrado.codigoTimbrado}"> </td>
                                <td th:text="${timbrado.numeroTimbrado}">  </td>
                                <td th:text="${timbrado.fechaInicio}"> </td>
                                <td th:text="${timbrado.fechaFin}"> </td>
                                <td th:text="${timbrado.estado.estado}"></td>
                                <td>
                                    <a id="editar" th:data-id="${timbrado.codigoTimbrado}" 
                                       class="btn btn-info btn-sm"  
                                       data-bs-toggle="modal" data-bs-target="#frm-modal">
                                        <i class="fa-regular fa-pen-to-square"></i>
                                    </a>
                                    <a 
                                        id="eliminar" data-url="/timbrado/eliminar/" th:data-id="${timbrado.codigoTimbrado}"
                                        class="btn btn-danger btn-sm "  >
                                        <i class="fa-solid fa-trash-can"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </main>
            <!-- Ventana modal -->
            <div class="modal fade" id="frm-modal" tabindex="-1" aria-labelledby="confirmacionModalLabel"
                 aria-hidden="true">
                <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable" role="document">
                    <form id="frm-timbrado" class="modal-content timbrado-modal"
                          th:action="@{/timbrado/guardar}" method="post" th:object="${timbrado}">
                        <header class="modal-header timbrado-modal-header">
                            <div class="timbrado-modal-heading">
                                <span class="timbrado-modal-icon"><i class="fa-solid fa-stamp"></i></span>
                                <div>
                                    <span class="timbrado-modal-kicker">Facturación</span>
                                    <h5 class="modal-title" id="confirmacionModalLabel">Agregar timbrado</h5>
                                </div>
                            </div>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                        </header>
                        <div class="modal-body timbrado-modal-body">
                            <p class="timbrado-modal-description">Complete el número, la vigencia y el estado del timbrado.</p>
                            <section class="timbrado-modal-section">
                                <h6><i class="fa-regular fa-calendar-check"></i> Datos y vigencia</h6>
                                <div class="row g-3">
                                <div class="col-12 col-md-6">
                                    <input type="hidden" name="codigoTimbrado" id="codigoTimbrado" th:value="*{codigoTimbrado}" />
                                    <label class="form-label" for="numeroTimbrado">Número de timbrado</label>
                                    <input type="text" name="numeroTimbrado" id="numeroTimbrado" th:value="*{numeroTimbrado}"
                                           class="form-control" inputmode="numeric" autocomplete="off" required />
                                </div>
                                <div class="col-12 col-md-6">
                                    <label class="form-label" for="inicioVigencia">Inicio de vigencia</label>
                                    <input type="text" name="fechaIicio" id="inicioVigencia" th:value="${fechaIicio}"
                                           class="form-control" autocomplete="off" required />
                                </div>
                                <div class="col-12 col-md-6">
                                    <label class="form-label" for="finVigencia">Fin de vigencia</label>
                                    <input type="text" name="fechaFin" id="finVigencia" class="form-control"
                                           autocomplete="off" required />
                                </div>
                                <div class="col-12 col-md-6">
                                    <label class="form-label" for="estado">Estado</label>
                                    <select th:object="${estado}" class="form-select" name="estado" id="estado" required>
                                        <option th:each="estado : ${estado}"
                                                th:value="${estado.codigoEstado}"
                                                th:text="${estado.estado}" />
                                    </select>
                                </div>
                                </div>
                            </section>
                        </div>
                        <footer class="modal-footer timbrado-modal-footer">
                            <button type="button" class="btn btn-light" data-bs-dismiss="modal">
                                <i class="fa-solid fa-xmark"></i> Cancelar
                            </button>
                            <button type="submit" name="guardar" class="btn btn-primario">
                                <i class="fas fa-save"></i> Guardar
                            </button>
                        </footer>
                    </form>
                </div>
            </div>

            <footer th:replace="~{layout/layout :: footer}"> </footer>
            <script type="module">
                import {
                guardar, consulta, eliminar, tabulador, tabular, mostrarAlerta, limpiar, datePickerInit
                }
                from '/js/modulos.js';
                datePickerInit('#inicioVigencia');
                datePickerInit('#finVigencia');
                $("#frm-modal").on('shown.bs.modal', () => {
                    tabular('#numeroTimbrado');
                });
                tabulador('#numeroTimbrado', '#inicioVigencia');
                eliminar('Seguro que desea eliminar timbrado??');
                $('#frm-timbrado').submit(function (event) {
                    event.preventDefault();
                    let url = '/timbrado/guardar';
                    let datos = {
                        codigoTimbrado: $('#codigoTimbrado').val(),
                        numeroTimbrado: $('#numeroTimbrado').val(),
                        fechaInicio: $('#inicioVigencia').val(),
                        fechaFin: $('#finVigencia').val(),
                        estado: {
                            codigoEstado: $('#estado').val()
                        }
                    };
                    guardar(datos, url, 'application/json').then((data) => {
                        $('#frm-timbrado').trigger('reset');
                        $('#frm-modal').modal('hide');
                        mostrarAlerta({
                            mensaje: data,
                            url: url,
                            recargar: true,
                            tipo: 'success'
                        });
                    });
                });

                $(document).on('click', '#editar', function (event) {
                    $('#confirmacionModalLabel').text('Editar timbrado');
                    let id = $(this).data('id');
                    let url = '/timbrado/editar';
                    let datos = {
                        codigoTimbrado: id
                    };
                    consulta(datos, url).then((data) => {
                        console.log(data);
                        $('#codigoTimbrado').val(data.codigoTimbrado);
                        $('#numeroTimbrado').val(data.numeroTimbrado);
                        $('#inicioVigencia').val(data.fechaInicio);
                        $('#finVigencia').val(data.fechaFin);
                        $('#estado').val(data.estado.codigoEstado);
                    });
                });
                $('#btn-agregar').on('click', function () {
                    $('#confirmacionModalLabel').text('Agregar timbrado');
                    $('#frm-timbrado').trigger('reset');
                    $('#codigoTimbrado').val('');
                });
            </script>

        </body>

</html>
