<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{layout/layout :: heat}"> </head>

    <body>
        <header th:replace="~{layout/layout :: header}"> </header>
        <aside th:replace="~{layout/layout :: aside}"> </aside>
        <div class="container">
            <header class="form-view-header"><div><h3>Datos del timbrado</h3><p>Configure número, vigencia y estado del timbrado.</p></div><span class="form-view-icon"><i class="fa-solid fa-stamp"></i></span></header>
            <a th:href="@{/timbrado/listar}" class="btn btn-primary">Regresar</a>
            <form th:action="@{/timbrado/guardar}" method="post" th:object="${timbrado}">
                <div class=" row d-flex m-5">
                    <div class="col-3">
                        <input type="hidden" name="codigoTimbrado" th:value="*{codigoTimbrado}" />
                        <label for="numeroTimbrado">NumeroTimbrado </label>
                        <input type="text" name="numeroTimbrado" id="numeroTimbrado" th:value="*{numeroTimbrado}"
                               class="form-control" />
                    </div>
                    <div class="col-3">
                        <label for="fechaIicio">FechaIicio </label>
                        <input type="text" name="fechaIicio" th:value="${fechaIicio}" class="form-control" />
                    </div>

                    <div class="col-3">
                        <label for="ESTADO">Estado</label>
                        <select th:field="*{estado}" class="form-control" name="ciudad">
                            <option th:each="estado : ${estados}"
                                    th:value="${estado.codigoEstado}"
                                    th:text="${estado.estado}" />
                        </select>
                    </div>
                </div>
                <input type="submit" name="guardar" value="Guardar" class="btn btn-success" />
            </form>
        </div>
        <footer th:replace="~{layout/layout :: footer}"> </footer>
        <script>
            $(document).ready(function () {
                var endpoint = window.location.pathname.replace(/[0-9]/g, '');
                if (endpoint == "/sucursal/editar/") {
                    $("#sucursal").prop("readonly", true);
                }
            })
        </script>
    </body>

</html>
