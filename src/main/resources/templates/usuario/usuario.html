<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head th:replace="~{layout/layout :: heat}"></head>
    <link rel="stylesheet" href="/css/usuario/formulario.css">
    <body>
        <header th:replace="~{layout/layout :: header}"></header>
        <aside th:replace="~{layout/layout :: aside}"></aside>

        <main id="listaUsuarios" class="container-fluid py-3">
            <section class="usuario-list-header">
                <div>
                    <span class="usuario-list-kicker">Clientes y contribuyentes</span>
                    <h3>Usuarios</h3>
                    <p>Administre los usuarios registrados en su sucursal.</p>
                </div>
                <a th:href="@{/usuario/agregar}" class="btn usuario-list-agregar">
                    <i class="fa-solid fa-user-plus"></i> Agregar usuario
                </a>
            </section>

            <div id="contenedor-alertas" class="mensaje-alerta mt-3" aria-live="polite"></div>

            <section class="usuario-list-card">
                <div class="usuario-list-summary">
                    <div>
                        <h4>Usuarios registrados</h4>
                        <p>Puede buscar por documento, nombre, teléfono, barrio o dirección.</p>
                    </div>
                    <span id="usuarioTotal" class="badge usuario-list-count">0</span>
                </div>
                <div class="table-responsive">
                    <table id="tablaUsuarios" class="table table-striped table-hover align-middle w-100">
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>RUC / CI</th>
                                <th>Usuario</th>
                                <th>Contacto</th>
                                <th>Ubicación</th>
                                <th>Sucursal - Ciudad</th>
                                <th>Estado</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                    </table>
                </div>
            </section>
        </main>

        <footer th:replace="~{layout/layout :: footer}"></footer>
        <script src="/js/usuario/tabla.js"></script>
        <script type="module">
            import {eliminar} from '/js/modulos.js';
            eliminar('¿Seguro que desea eliminar este usuario?');
        </script>
    </body>
</html>
