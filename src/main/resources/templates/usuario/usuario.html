<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml" 
      xmlns:th="http://www.thymeleaf.org">
    <head  th:replace="~{layout/layout :: heat}"> </head>
    <body>
        <header  th:replace="~{layout/layout :: header}"> </header>
        <aside  th:replace="~{layout/layout :: aside}"> </aside>
        <div class="container-fluid">
            <div class="card-header" >
                <h3 class="form-title">Usuarios</h3>
            </div>
            <div class="d-md-flex bg-opacity-100">
                <div class="col-sm-2">
                    <a th:href="@{/usuario/agregar}" 
                       class="btn btn-primario btn-sm m-2 ">
                        <i class="fa-solid fa-plus fa-lg "> </i> Usuario
                    </a>
                </div >
                <div class="input-group m-2 ">
                    <input name="txtBuscar" id="txtBuscar" type="search" 
                           class="col p-2"
                           autofocus="true" placeholder="Buscar por ruc/ci o nombres" 
                           aria-label="Buscar" aria-describedby="search-addon" />
                </div> 
            </div>
            <div class="mensaje-alerta"id="contenedor-alertas" ></div>
            <div class="table-responsive-xl">
                <table class="table table-border table-striped table-colapse table-hover table-xl" >
                    <thead  class="bg-color">
                        <tr>
                            <th>Codigo</th>
                            <th>Ruc/Ci</th>
                            <th class="sticky-start">Nombre</th>
                            <th>Celular</th>
                            <th>Telefono</th>
                            <th>Barrio</th>
                            <th>Direccion</th>
                            <th>Sucursal</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody  id="tbody" class="table-secondary"  >
                        <tr  th:each="usuario : ${usuarios}" > 
                            <td th:text="${usuario.codigoUsuario}"> </td>
                            <td th:text="${usuario.numeroDocumento}">  </td>
                            <td class="sticky-start" th:text="${usuario.nombre} +' '+${usuario.apellido}"> </td>
                            <td th:text="${usuario.celular}"></td>
                            <td th:text="${usuario.telefono}"></td>
                            <td th:text="${usuario.barrio}"></td>
                            <td th:text="${usuario.direccion}"></td>
                            <td th:text= "${usuario.sucursal.nombreSucursal}+' '+${usuario.sucursal.ciudad.nombreCiudad}"></td>
                            <td>
                                <a sec:authorize="hasAnyAuthority('ROOT','ADMINISTRADOR')" th:href="@{/usuario/editar/} + ${usuario.codigoUsuario}"
                                   class="btn btn-info btn-sm">
                                    <i class="fa-regular fa-pen-to-square"></i> 
                                </a>
                                <a sec:authorize="hasAnyAuthority('ROOT','ADMINISTRADOR')" id="eliminar" data-url="/usuario/eliminar/" 
                                   th:data-id="${usuario.codigoUsuario}" 
                                   class="btn btn-danger btn-sm" > 
                                    <i class="fa-solid fa-trash-can "></i> 
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <nav  th:replace="~{layout/paginador :: paginador}"> </nav>
            </div>


        </div>
        <footer  th:replace="~{layout/layout :: footer}"> </footer>
        <script src="/js/buscarUsuario.js"></script>
        <script type="module">
            import {eliminar} from  '/js/modulos.js';
                eliminar('Seguro que desea eliminar el usuario');
        </script>

    </body>

</html>
