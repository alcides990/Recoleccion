<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{layout/layout :: heat}">  </head>
    <body> 
        <header  th:replace="~{layout/layout :: header}"> </header>
        <aside th:replace="~{layout/layout :: aside}"></aside>

        <div class="container p-1"> 
            <div class="card-header"> <h3>Datos de Usuario</h3> </div>
            <a th:href="@{/usuario/listar}" class="btn btn-primario ms-3">Regresar</a>
            <form th:action="@{/usuario/guardar}" method="post" th:object="${usuario}">
                <div class="row d-flex m-1">
                    <input type="hidden" name="codigoUsuario"  th:value="*{codigoUsuario}" />
                    <div class="form-group col-sm-2">
                        <label class="  form-label" for="tipoDocumento">Tipo Documento  </label>
                        <select th:object="${tipoDocumento}" class="form-select" name="tipoDocumento" >
                            <option th:each="tipoDocumento : ${tipoDocumento}" 
                                    th:value="${tipoDocumento.codigoTipoDocumento}"
                                    th:text="${tipoDocumento.tipoDocumento} " 
                                    th:selected="${tipoDocumento}== ${usuario.tipoDocumento}"/>
                        </select>
                    </div>
                    <div class="form-group col-sm-2">
                        <label class="  form-label" for="numeroDocumento">N° Documento </label>
                        <input type="text" name="numeroDocumento"  th:value="*{numeroDocumento}" class="form-control" placeholder="Ingrese numero de documento" required="campo ogligatorio"/>
                    </div>
                    <div class="form-group col-sm-4">
                        <label class="  form-label" for="nombre">Nombre </label>
                        <input type="text" name="nombre"  th:value="*{nombre}" class="form-control" placeholder="Ingrese nombre " required="campo ogligatorio"/>
                    </div>
                    <div class="form-group col-sm-4">
                        <label class="  form-label" for="apellido">Apellido </label>
                        <input type="text" name="apellido"  th:value="*{apellido}" class="form-control" placeholder="Ingrese apellido" required="campo ogligatorio"/>
                    </div>
                    <div class="form-group col-sm-3">
                        <label class="form-label" for="celular">Celular </label>
                        <input type="text" name="celular"  th:value="*{celular}" class="form-control" placeholder="Ingrese numero de celular" />
                    </div>
                    <div class="form-group col-sm-3">
                        <label  class="form-label" for="telefono">Telefono </label>
                        <input type="text" name="telefono"  th:value="*{telefono}" class="form-control" placeholder="Ingrese numero de telefono" />
                    </div>
                    <div class="form-group col-sm-3">
                        <label class="form-label" for="barrio">Barrio </label>
                        <input type="text" name="barrio"  th:value="*{barrio}" class="form-control" placeholder="Ingrese nombre del barrio" />
                    </div>
                    <div class="form-group col-sm-5">
                        <label  class="form-label" for="direccio">Direccion </label>
                        <input type="text" name="direccion"  th:value="*{direccion}" class="form-control" placeholder="Ingrese direccion" />
                    </div>
                    <div class="form-group col-sm-5">
                        <label  class="form-label" for="observacion">Observacion </label>
                        <input type="text" name="observacion"  th:value="*{observacion}" class="form-control" placeholder="Ingrese observacion " />
                    </div>
                    <div class="form-group col-sm-3">
                        <label class="  form-label" for="sucursal">Sucursal</label>
                        <select th:object="${sucursal}" class="form-control" name="sucursal" >
                            <option th:each="sucursal : ${sucursal}" 
                                    th:value="${sucursal.codigoSucursal}"
                                    th:text="${sucursal.nombreSucursal} +' '+${sucursal.ciudad.nombreCiudad} "  />
                        </select>
                    </div>

                    <div class="form-group col-sm-3">
                        <label class="  form-label" for="estado">Estado</label>
                        <select th:object="${estado}" class="form-control" name="estado" >
                            <option th:each="estado : ${estado} " 
                                    th:value="${estado.codigoEstado}"
                                    th:text="${estado.estado}"  />
                        </select>
                    </div>
                </div>
                <input type="submit" name="guardar" value="Guardar" class="btn-guardar m-3"/>
            </form>
        </div>
        <footer th:replace="~{layout/layout :: footer}"></footer>
    </body>
</html>
