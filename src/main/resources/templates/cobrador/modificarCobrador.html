<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{layout/layout :: heat}"></head>
    <link rel="stylesheet" th:href="@{/css/cobrador/formulario.css}">
    <body>
        <header th:replace="~{layout/layout :: header}"></header>
        <aside th:replace="~{layout/layout :: aside}"></aside>

        <main id="formularioCobrador" class="container-fluid">
            <header class="form-view-header"><div><h3>Datos del cobrador</h3><p>Registre o actualice al responsable de cobranza.</p></div><span class="form-view-icon"><i class="fa-solid fa-user-tie"></i></span></header>

            <section class="cobrador-form-card">
                <div class="cobrador-form-intro">
                    <div class="cobrador-form-icon" aria-hidden="true">
                        <i class="fa-solid fa-user-tie"></i>
                    </div>
                    <h4>Datos del responsable</h4>
                    <p>Registre los datos personales, asignación de sucursal y estado del cobrador.</p>
                </div>

                <form class="cobrador-form" th:action="@{/cobrador/guardar}" method="post" th:object="${cobrador}">
                    <input type="hidden" name="codigoCobrador" th:value="*{codigoCobrador}">

                    <div class="row g-3">
                        <div class="col-sm-4">
                            <label class="form-label" for="nombre">Nombre</label>
                            <div class="cobrador-input-wrap">
                                <i class="fa-solid fa-user" aria-hidden="true"></i>
                                <input id="nombre" class="form-control" type="text" name="nombre"
                                       th:value="*{nombre}" placeholder="Ingrese nombre">
                            </div>
                            <span class="cobrador-error" role="alert" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}">Error</span>
                        </div>
                        <div class="col-sm-4">
                            <label class="form-label" for="apellido">Apellido</label>
                            <div class="cobrador-input-wrap">
                                <i class="fa-solid fa-user" aria-hidden="true"></i>
                                <input id="apellido" class="form-control" type="text" name="apellido"
                                       th:value="*{apellido}" placeholder="Ingrese apellido">
                            </div>
                            <span class="cobrador-error" role="alert" th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}">Error</span>
                        </div>
                        <div class="col-sm-4">
                            <label class="form-label" for="celular">Celular</label>
                            <div class="cobrador-input-wrap">
                                <i class="fa-solid fa-mobile-screen-button" aria-hidden="true"></i>
                                <input id="celular" class="form-control" type="text" name="celular"
                                       th:value="*{celular}" placeholder="Ingrese número de celular">
                            </div>
                        </div>
                        <div class="col-sm-6">
                            <label class="form-label" for="direccion">Dirección</label>
                            <div class="cobrador-input-wrap">
                                <i class="fa-solid fa-location-dot" aria-hidden="true"></i>
                                <input id="direccion" class="form-control" type="text" name="direccion"
                                       th:value="*{direccion}" placeholder="Ingrese dirección">
                            </div>
                        </div>
                        <div class="col-sm-3">
                            <label class="form-label" for="sucursal">Sucursal</label>
                            <div class="cobrador-input-wrap" th:if="${esRoot}">
                                <i class="fa-solid fa-building" aria-hidden="true"></i>
                                <select id="sucursal" class="form-select" name="sucursal.codigoSucursal">
                                    <option th:each="sucursal : ${sucursal}"
                                            th:value="${sucursal.codigoSucursal}"
                                            th:text="${sucursal.nombreSucursal} + ' ' + ${sucursal.ciudad.nombreCiudad}"
                                            th:selected="${cobrador.sucursal != null and sucursal.codigoSucursal == cobrador.sucursal.codigoSucursal}"></option>
                                </select>
                            </div>
                            <div class="cobrador-input-wrap" th:if="${!esRoot}">
                                <i class="fa-solid fa-building" aria-hidden="true"></i>
                                <input id="sucursal" class="form-control" type="text"
                                       th:value="${sucursalSesion.nombreSucursal} + ' ' + ${sucursalSesion.ciudad.nombreCiudad}"
                                       readonly>
                            </div>
                        </div>
                        <div class="col-sm-3">
                            <label class="form-label" for="estado">Estado</label>
                            <div class="cobrador-input-wrap">
                                <i class="fa-solid fa-toggle-on" aria-hidden="true"></i>
                                <select id="estado" th:object="${estado}" class="form-select" name="estado">
                                    <option th:each="estado : ${estado}"
                                            th:value="${estado.codigoEstado}"
                                            th:text="${estado.estado}"></option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="cobrador-form-actions">
                        <a th:href="@{/cobrador/listar}" class="btn cobrador-btn-cancelar">
                            <i class="fa-solid fa-arrow-left"></i> Regresar
                        </a>
                        <button type="submit" name="guardar" class="btn cobrador-btn-guardar">
                            <i class="fa-solid fa-floppy-disk"></i> Guardar cobrador
                        </button>
                    </div>
                </form>
            </section>
        </main>

        <footer th:replace="~{layout/layout :: footer}"></footer>
    </body>
</html>
