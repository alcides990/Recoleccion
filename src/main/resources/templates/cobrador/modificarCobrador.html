<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <head  th:replace="~{layout/layout :: heat}"> </head>
    <body>
        <header  th:replace="~{layout/layout :: header}"> </header>
        <aside  th:replace="~{layout/layout :: aside}"> </aside>
        <div class="container"> 
            <h3 class="form-title">Datos de Cobrador</h3>
            <a th:href="@{/cobrador/listar}" class="btn btn-primario">
                <i class="fa-solid fa-arrow-left"></i>
                Regresar</a>
            <form th:action="@{/cobrador/guardar}" method="post" th:object="${cobrador}">
                <div class="row m-3">
                    <input type="hidden" name="codigoCobrador"  th:value="*{codigoCobrador}" />
                    <div class="form-group col-sm-4">
                        <label class="form-label" for="nombre">Nopmbre </label>
                        <input class="form-control "  type="text" name="nombre"  th:value="*{nombre}" placeholder="Ingrese nombre " />
                        <span class="alert-danger" role="alert" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"> error</span>
                    </div>
                    <div class="form-group col-sm-4">
                        <label  class="form-label" for="apellido">Apellido </label>
                        <input class="form-control " type="text" name="apellido"  th:value="*{apellido}"  placeholder="Ingrese apellido" />
                        <span class="alert-danger" role="alert" th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}"> error</span>
                    </div>     
                    <div class="form-group col-sm-4">
                        <label  class="form-label" for="celular">Celular </label>
                        <input class="form-control " type="text" name="celular"  th:value="*{celular}" placeholder="Ingrese numero de celular" />
                    </div>
                    <div class="form-group col-sm-5">
                        <label  class="form-label" for="direccio">Direccion </label>
                        <input class="form-control" type="text" name="direccion"  th:value="*{direccion}"  placeholder="Ingrese direccion" />
                    </div>
                    <div class="col-sm-3"> 
                        <label for="sucursal">Sucursal</label>
                        <select th:object="${sucursal}" class="form-control" name="sucursal" >
                            <option th:each="sucursal : ${sucursal}" 
                                    th:value="${sucursal.codigoSucursal}"
                                    th:text="${sucursal.nombreSucursal}+' '+${sucursal.ciudad.nombreCiudad}" />
                        </select>
                    </div>

                    <div class="col-sm-3"> 
                        <label for="estado">Estado</label>
                        <select th:object="${estado}" class="form-control" name="estado" >
                            <option th:each="estado : ${estado} " 
                                    th:value="${estado.codigoEstado}"
                                    th:text="${estado.estado}"  />
                        </select>
                    </div>
                </div>
                <input type="submit" name="guardar" value="Guardar" class="btn btn-primario m-3"/>
        </div>
        </form>
        </div>
        <footer  th:replace="~{layout/layout :: footer}"> </footer>

    </body>
</html>
