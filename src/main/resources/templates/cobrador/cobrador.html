<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{layout/layout :: heat}"></head>
    <link rel="stylesheet" href="/css/cobrador/formulario.css">
    <body>
        <header th:replace="~{layout/layout :: header}"></header>
        <aside th:replace="~{layout/layout :: aside}"></aside>

        <main id="listaCobradores" class="container-fluid py-3">
            <section class="cobrador-list-header">
                <div>
                    <span class="cobrador-list-kicker">Equipo de cobranza</span>
                    <h3>Cobradores</h3>
                    <p>Administre los cobradores asignados a su sucursal.</p>
                </div>
                <a th:href="@{/cobrador/agregar}" class="btn cobrador-list-agregar">
                    <i class="fa-solid fa-user-plus"></i> Agregar cobrador
                </a>
            </section>

            <div id="contenedor-alertas" class="mensaje-alerta mt-3" aria-live="polite"></div>
            <div th:if="${info}" class="alert alert-success alert-dismissible fade show mt-3" role="alert">
                <i class="fa-solid fa-circle-check me-1"></i>
                <span th:text="${info}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
            </div>

            <section class="cobrador-list-card">
                <div class="cobrador-list-summary">
                    <div>
                        <h4>Cobradores registrados</h4>
                        <p>Busque por nombre, celular, dirección o estado.</p>
                    </div>
                    <span id="cobradorTotal" class="badge cobrador-list-count">0</span>
                </div>
                <div class="table-responsive">
                    <table id="tablaCobradores" class="table table-striped table-hover align-middle w-100">
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Cobrador</th>
                                <th>Celular</th>
                                <th>Dirección</th>
                                <th>Estado</th>
                                <th>Sucursal - Ciudad</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                    </table>
                </div>
            </section>
        </main>

        <footer th:replace="~{layout/layout :: footer}"></footer>
        <script src="/js/cobrador/tabla.js"></script>
        <script type="module">
            import {eliminar} from '/js/modulos.js';
            eliminar('¿Seguro que desea eliminar este cobrador?');
        </script>
    </body>
</html>
