<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml" 
      xmlns:th="http://www.thymeleaf.org">
    <head  th:replace="~{layout/layout :: heat}"> </head>
    <body>
        <header  th:replace="~{layout/layout :: header}"> </header>
        <aside  th:replace="~{layout/layout :: aside}"> </aside>
        <div class="container ">
            <h3 class="card-header">Cobradores</h3>
            <a th:href="@{/cobrador/agregar}" class="btn btn-primario btn-sm mb-3">
                <i class="fa-solid fa-plus fa-xl"></i>
                Agregar </a>
            <div class="mensaje-alerta" id="contenedor-alertas"></div>
            <div th:if="${info}" class="mensaje-alerta alert alert-success">
                <span th:text="${info}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div class="table-responsive-md">
                <table id="tabla" class="table table-dark table-border table-striped table-colapse table-hover table-md" >
                    <thead>
                        <tr>
                            <th>Codigo</th>
                            <th>Nombre</th>
                            <th>Apellido</th>
                            <th>Celular</th>
                            <th>Direccion</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody class="table-secondary">
                        <tr th:each="cobrador : ${cobradores}">
                            <td th:text="${cobrador.codigoCobrador}">  </td>
                            <td th:text="${cobrador.nombre}">   </td>
                            <td th:text="${cobrador.apellido}" >   </td>
                            <td th:text="${cobrador.celular}"></td>
                            <td th:text="${cobrador.direccion}"></td>
                            <td th:text="${cobrador.estado.estado}"></td>
                            <td>
                                <a th:href="@{/cobrador/editar/} + ${cobrador.codigoCobrador}" 
                                   class="btn btn-info btn-sm me-2"/>
                                <i class="fa-solid fa-pen-to-square"></i>
                                <a id="eliminar" data-url="/cobrador/eliminar/" th:data-id="${cobrador.codigoCobrador}"
                                   class="btn btn-danger eliminar btn-sm" >
                                    <i class="fa-regular fa-trash-can"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
        <footer  th:replace="~{layout/layout :: footer}"> </footer>
        <script>
            //Lamara al metodo eliminar al hacer click en el boton eliminar
            $(document).ready(function () {
//                Llamar al metodo eliminar al cargar documento 
                eliminar('Seguro que desea eliminar este cobrador');
//                Cargar idioma español a la tabla paginado con Jquerry data
                $('#tabla').DataTable({
                    language: {
                        url: '/i18n/es-ES.json'
                    }
                });
            });
        </script>
    </body>

</html>
