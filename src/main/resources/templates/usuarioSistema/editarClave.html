<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{layout/layout :: heat}"></head>
    <link rel="stylesheet" th:href="@{/css/usuarioSistema/editar-clave.css}">
    <body>
        <header th:replace="~{layout/layout :: header}"></header>
        <aside th:replace="~{layout/layout :: aside}"></aside>

        <main id="editarClaveUsuario" class="container-fluid">
            <header class="form-view-header"><div><h3>Actualizar contraseña</h3><p>Defina una nueva contraseña para proteger su cuenta.</p></div><span class="form-view-icon"><i class="fa-solid fa-shield-halved"></i></span></header>

            <section class="editar-clave-card">
                <div class="editar-clave-intro">
                    <div class="editar-clave-icon" aria-hidden="true">
                        <i class="fa-solid fa-shield-halved"></i>
                    </div>
                    <h4>Proteja su cuenta</h4>
                    <p>Defina una nueva contraseña para continuar usando el sistema de forma segura.</p>
                    <div class="editar-clave-nota">
                        <i class="fa-solid fa-circle-info" aria-hidden="true"></i>
                        <span>Al guardar deberá iniciar sesión nuevamente.</span>
                    </div>
                </div>

                <form class="editar-clave-form" th:action="@{/usuarioSistema/editarClave}" method="post" th:object="${usuarioSistema}">
                    <input type="hidden" name="codigoUsuarioSistema" th:value="*{codigoUsuarioSistema}">

                    <div class="editar-clave-field">
                        <label for="usuarioSistema">Usuario</label>
                        <div class="editar-clave-input-wrap">
                            <i class="fa-solid fa-user" aria-hidden="true"></i>
                            <input id="usuarioSistema" class="form-control" type="text" name="nombre"
                                   th:value="*{nombre}" readonly>
                        </div>
                    </div>

                    <div class="editar-clave-field">
                        <label for="clave">Nueva contraseña</label>
                        <div class="editar-clave-input-wrap">
                            <i class="fa-solid fa-lock" aria-hidden="true"></i>
                            <input id="clave" class="form-control" type="password" name="clave"
                                   placeholder="Ingrese una nueva contraseña" autocomplete="new-password" autofocus required>
                        </div>
                    </div>

                    <div class="editar-clave-actions">
                        <a th:href="@{/usuarioSistema/listar}" class="btn editar-clave-cancelar">
                            <i class="fa-solid fa-arrow-left"></i> Regresar
                        </a>
                        <button type="submit" class="btn editar-clave-guardar">
                            <i class="fa-solid fa-floppy-disk"></i> Guardar clave
                        </button>
                    </div>
                </form>
            </section>
        </main>

        <footer th:replace="~{layout/layout :: footer}"></footer>
    </body>
</html>
