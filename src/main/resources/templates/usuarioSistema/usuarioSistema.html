<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head th:replace="~{layout/layout :: heat}"></head>
    <link rel="stylesheet" href="/css/usuarioSistema/formulario.css">
    <body>
        <header th:replace="~{layout/layout :: header}"></header>
        <aside th:replace="~{layout/layout :: aside}"></aside>

        <main class="container-fluid usuarios-sistema-lista py-3">
            <section class="usuarios-sistema-lista-header">
                <div>
                    <span class="usuario-sistema-kicker">Seguridad y acceso</span>
                    <h3>Usuarios del sistema</h3>
                    <p>Administre usuarios, sucursales y permisos de acceso.</p>
                </div>
                <a th:href="@{/usuarioSistema/agregar}" class="btn usuarios-sistema-agregar">
                    <i class="fa-solid fa-user-plus"></i> Agregar usuario
                </a>
            </section>

            <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show mt-3" role="alert">
                <i class="fa-solid fa-circle-check me-1"></i>
                <span th:text="${mensaje}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
            </div>
            <div class="mensaje-alerta mt-3" id="contenedor-alertas" aria-live="polite"></div>

            <section class="usuarios-sistema-tabla-card">
                <table id="tablaUsuariosSistema" class="table table-striped table-hover align-middle w-100">
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Usuario</th>
                            <th>Sucursal - Ciudad</th>
                            <th>Estado</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                </table>
            </section>
        </main>

        <footer th:replace="~{layout/layout :: footer}"></footer>
        <script src="/js/usuarioSistema/tabla.js"></script>
        <script type="module">
            import {eliminar} from '/js/modulos.js';
            eliminar('¿Seguro que desea eliminar este usuario del sistema?');
        </script>
    </body>
</html>
