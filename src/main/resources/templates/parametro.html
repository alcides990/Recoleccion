<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{layout/layout :: heat}">  </head>
    <body> 
        <header  th:replace="~{layout/layout :: header}"> </header>
        <aside th:replace="~{layout/layout :: aside}"></aside>

        <div class="container p-1"> 
            <header class="form-view-header"><div><h3>Parámetros del sistema</h3><p>Configure el cierre del período, comisión y recargo de la sucursal.</p></div><span class="form-view-icon"><i class="fa-solid fa-sliders"></i></span></header>
            <div th:if="${mensaje}" class="mensaje-alerta alert alert-success">
                <span th:text="${mensaje}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${error}" class="mensaje-alerta alert alert-danger">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <form th:if="${esRoot}" th:action="@{/parametro/listar}" method="get"
                  class="card border-0 shadow-sm p-3 m-1 mb-3">
                <div class="row align-items-end">
                    <div class="col-md-6">
                        <label class="form-label" for="selectorSucursalParametro">Sucursal a configurar</label>
                        <select id="selectorSucursalParametro" name="codigoSucursal" class="form-select"
                                onchange="this.form.submit()">
                            <option th:each="item : ${sucursales}"
                                    th:value="${item.codigoSucursal}"
                                    th:text="${item.nombreSucursal + ' - ' + item.ciudad.nombreCiudad}"
                                    th:selected="${item.codigoSucursal == sucursal.codigoSucursal}"></option>
                        </select>
                    </div>
                </div>
            </form>
            <form th:action="@{/parametro/guardar}" method="post" th:object="${parametro}">
                <div class="d-flex justify-content-between align-items-center m-1 mb-3">
                    <div>
                        <h4 class="mb-1" th:text="${existeParametro ? 'Configuración actual' : 'Nuevo parámetro'}"></h4>
                        <span class="badge"
                              th:classappend="${existeParametro ? 'bg-success' : 'bg-warning text-dark'}"
                              th:text="${existeParametro ? 'CONFIGURADO' : 'SIN CONFIGURAR'}"></span>
                    </div>
                </div>
                <div class="row d-flex m-1">
                    <input type="hidden" name="codigoSucursal" th:value="${sucursal.codigoSucursal}" />
                    <input type="hidden" name="codigoEmpresa"  th:value="${empresa.codigoEmpresa}" />
                    <input type="hidden" name="codigoParametro"  th:value="*{codigoParametro}" />
                    <div class="form-group col-sm-3">
                        <label class="  form-label" for="ruc">RUC </label>
                        <input type="text" name="ruc"  th:value="${empresa.ruc}" class="form-control"  required="campo ogligatorio"/>
                    </div>
                    <div class="form-group col-sm-6">
                        <label class="  form-label" for="razonSocial">Razon social </label>
                        <input type="text" name="razonSocial"  th:value="${empresa.razonSocial}" class="form-control"  required="campo ogligatorio"/>
                    </div>
                    <div class="form-group col-sm-3">
                        <label class="  form-label" for="sucursal">Sucursal</label>
                        <input id="sucursal" type="text" class="form-control" readonly
                               th:value="${sucursal.nombreSucursal + ' - ' + sucursal.ciudad.nombreCiudad}" />
                    </div>
                </div>
                <div class="row d-flex m-1">
                    <div class="form-group col-sm-2">
                        <label class="  form-label" for="recargoMora">Recargo Mora %</label>
                        <input type="number" name="recargoMora" th:value="*{recargoMora}"
                               class="form-control" min="0" max="100" step="0.1" required />
                    </div>
                    <div class="form-group col-sm-2">
                        <label class="  form-label" for="cierrePeriodo">Cierre Periodo</label>
                        <input type="text" name="cierrePeriodo" id="cierrePeriodo"  th:value="*{cierrePeriodo}" class="form-control"  required="campo ogligatorio"/>
                    </div>
                    <div class="form-group col-sm-3">
                        <label class="  form-label" for="comision">Comision </label>
                        <select class="form-select" name="comision" required>
                            <option value="" th:selected="${parametro.comision == null}">Seleccione una comisión</option>
                            <option th:each="comision : ${comisiones}" 
                                    th:value="${comision.codigoComision}"
                                    th:text="${comision.nombreComision} " 
                                    th:selected="${parametro.comision != null
                                        and comision.codigoComision == parametro.comision.codigoComision}"/>
                        </select>
                    </div>
                </div>
                <button type="submit" name="guardar" class="btn-primario m-3">
                    <i class="fa-solid" th:classappend="${existeParametro ? 'fa-floppy-disk' : 'fa-plus'}"></i>
                    <span th:text="${existeParametro ? 'Guardar cambios' : 'Crear parámetro'}"></span>
                </button>
            </form>
            <form th:if="${existeParametro}" id="formEliminarParametro"
                  th:action="@{/parametro/eliminar}" method="post" class="m-1">
                <input type="hidden" name="codigoSucursal" th:value="${sucursal.codigoSucursal}" />
                <button type="submit" class="btn btn-danger">
                    <i class="fa-solid fa-trash-can"></i> Eliminar parámetro
                </button>
            </form>
        </div>
        <footer th:replace="~{layout/layout :: footer}"></footer>
        <script src="/js/datepicker-es.js"></script>
        <script>
            $.datepicker.setDefaults($.datepicker.regional["es"]);
            $("#cierrePeriodo").datepicker({
                changeYear: true
            }
            );
            $("#formEliminarParametro").on("submit", function (evento) {
                if (!window.confirm("¿Seguro que desea eliminar los parámetros de esta sucursal?")) {
                    evento.preventDefault();
                }
            });
        </script>
    </body>
</html>
