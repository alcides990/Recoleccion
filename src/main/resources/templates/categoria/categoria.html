<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{layout/layout :: heat}"></head>
    <link rel="stylesheet" href="/css/categoria/formulario.css">
    <body>
        <header th:replace="~{layout/layout :: header}"></header>
        <aside th:replace="~{layout/layout :: aside}"></aside>

        <main id="listaCategorias" class="container-fluid py-3">
            <section class="categoria-list-header">
                <div>
                    <span class="categoria-kicker">Tarifas de servicio</span>
                    <h3>Categorías</h3>
                    <p>Administre las categorías y tarifas de su sucursal.</p>
                </div>
                <button id="btnAgregarCategoria" type="button" class="btn categoria-list-agregar"
                        data-bs-toggle="modal" data-bs-target="#modificarModal">
                    <i class="fa-solid fa-plus"></i> Agregar categoría
                </button>
            </section>

            <div id="contenedor-alertas" class="mensaje-alerta mt-3" aria-live="polite"></div>

            <section class="categoria-list-card">
                <div class="categoria-list-summary">
                    <div>
                        <h4>Categorías registradas</h4>
                        <p>Busque por nombre, sucursal o ciudad.</p>
                    </div>
                    <span id="categoriaTotal" class="badge categoria-list-count">0</span>
                </div>
                <div class="table-responsive">
                    <table id="tablaCategorias" class="table table-striped table-hover align-middle w-100">
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Categoría</th>
                                <th>Tarifa</th>
                                <th>Sucursal - Ciudad</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                    </table>
                </div>
            </section>
        </main>

        <div class="modal fade" id="modificarModal" tabindex="-1" aria-labelledby="tituloCategoriaModal"
             aria-hidden="true" data-bs-backdrop="static">
            <div class="modal-dialog modal-dialog-centered" role="document">
                <form id="frm-categoria" class="modal-content categoria-modal">
                    <header class="modal-header categoria-modal-header">
                        <div>
                            <span class="categoria-kicker">Tarifa de recolección</span>
                            <h5 id="tituloCategoriaModal" class="modal-title">Nueva categoría</h5>
                        </div>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </header>
                    <div class="modal-body categoria-modal-body">
                        <input type="hidden" id="codigoCategoria" name="codigoCategoria">
                        <input type="hidden" id="codigoSucursalCategoria" th:value="${sucursal.codigoSucursal}">
                        <div class="categoria-sucursal-info">
                            <i class="fa-solid fa-building"></i>
                            <div>
                                <small>Sucursal asignada</small>
                                <strong th:text="${sucursal.nombreSucursal + ' - ' + sucursal.ciudad.nombreCiudad}">Sucursal</strong>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="nombreCategoria">Nombre de la categoría</label>
                            <input class="form-control" type="text" id="nombreCategoria" name="nombreCategoria"
                                   maxlength="100" placeholder="Ej.: Residencial" autocomplete="off" required>
                        </div>
                        <div>
                            <label class="form-label" for="tarifa">Tarifa</label>
                            <div class="categoria-tarifa-input">
                                <span>Gs.</span>
                                <input class="form-control" type="number" name="tarifa" id="tarifa"
                                       min="1" step="1" inputmode="numeric"
                                       placeholder="Ingrese un monto mayor a cero" required>
                            </div>
                        </div>
                    </div>
                    <footer class="modal-footer categoria-modal-footer">
                        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                        <button id="guardarCategoria" type="submit" class="btn btn-primario">
                            <i class="fa-solid fa-floppy-disk"></i> Guardar categoría
                        </button>
                    </footer>
                </form>
            </div>
        </div>

        <footer th:replace="~{layout/layout :: footer}"></footer>
        <script src="/js/categoria/tabla.js"></script>
        <script type="module">
            import {consultar, guardar, eliminar, mostrarAlerta} from '/js/modulos.js';

            eliminar('¿Seguro que desea eliminar esta categoría?');

            $('#btnAgregarCategoria').on('click', function () {
                $('#tituloCategoriaModal').text('Nueva categoría');
                $('#frm-categoria').trigger('reset');
                $('#codigoCategoria').val('');
            });

            $(document).on('click', '.editar-categoria', function () {
                $('#tituloCategoriaModal').text('Editar categoría');
                consultar({codigoCategoria: $(this).data('id')}, '/categoria/editar')
                        .then(function (respuesta) {
                            $('#codigoCategoria').val(respuesta.codigoCategoria);
                            $('#nombreCategoria').val(respuesta.nombreCategoria);
                            $('#tarifa').val(respuesta.tarifa);
                        });
            });

            $('#modificarModal').on('shown.bs.modal', function () { $('#nombreCategoria').trigger('focus'); });

            $('#frm-categoria').on('submit', function (event) {
                event.preventDefault();
                if (!this.checkValidity()) {
                    this.reportValidity();
                    return;
                }
                const boton = $('#guardarCategoria').prop('disabled', true);
                const codigo = $('#codigoCategoria').val();
                const categoria = {
                    codigoCategoria: codigo ? Number(codigo) : null,
                    nombreCategoria: $('#nombreCategoria').val().trim(),
                    tarifa: Number($('#tarifa').val()),
                    sucursal: {codigoSucursal: Number($('#codigoSucursalCategoria').val())}
                };
                guardar(categoria, '/categoria/guardar', 'application/json')
                        .then(function (mensaje) {
                            bootstrap.Modal.getOrCreateInstance(document.getElementById('modificarModal')).hide();
                            mostrarAlerta({mensaje: mensaje, url: '', tipo: 'success', recargar: false});
                            $('#tablaCategorias').DataTable().ajax.reload(null, false);
                        })
                        .finally(function () { boton.prop('disabled', false); });
            });
        </script>
    </body>
</html>
