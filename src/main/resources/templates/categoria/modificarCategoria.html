<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <head  th:replace="~{layout/layout :: heat}"> </head>
    <body>
        <header  th:replace="~{layout/layout :: header}"> </header>
        <aside  th:replace="~{layout/layout :: aside}"> </aside>
        <div class="container"> 
            <header class="form-view-header"><div><h3>Datos de la categoría</h3><p>Configure el nombre, tarifa y estado de la categoría.</p></div><span class="form-view-icon"><i class="fa-solid fa-tags"></i></span></header>
            <a th:href="@{/categoria/listar}" class="btn btn-primario"> <i class="fa-solid fa-angles-left"></i>Regresar</a>
            <div class="mensaje-alerta" id="contenedor-alertas"></div>
            <form  id="frm-categoria" th:action="@{/categoria/guardar}" method="post" th:object="${categoria}">
                <div class="">
                    <input type="hidden" id="codigoCategoria"  name="codigoCategoria" th:value="*{codigoCategoria}" />
                    <div class="form-group col-sm-5"> 
                        <label class="col-form-label" for="nombreCategoria">Categoria </label>
                        <input class="form-control" th:errorclass="'form-control alert-danger'" type="text" id="nombreCategoria" name="nombreCategoria" th:value="*{nombreCategoria}"  placeholder="Ingrese nombre categoria"  autofocus="true"/>
                    </div>
                    <div class="form-group col-sm-3"> 
                        <label class="col-form-label" for="tarifs">Tarifa </label>
                        <input class="form-control" th:errorclass="'form-control alert-danger'" type="number" name="tarifa" id="tarifa" th:value="*{tarifa}"  placeholder="Ingrese Monto de la Tarifa.." />
                    </div>
                    <div class="form-group col-sm-3"> 
                        <label class="col-form-label" for="sucursal">Sucursal</label>
                        <select class="form-control" th:field="*{sucursal}"  name="sucursal" id="sucursal">
                            <option th:each="sucursal : ${sucursal}" 
                                    th:value="${sucursal.codigoSucursal}"
                                    th:text="${sucursal.nombreSucursal}+' '+${sucursal.ciudad.nombreCiudad}"  />
                        </select>
                    </div>
                </div>
                <input type="submit" name="guardar" value="Guardar" class="btn btn-guardar"/>

            </form>
        </div>
        <footer  th:replace="~{layout/layout :: footer}"> </footer>
        <script>
            $('#frm-categoria').submit(function (event) {
                event.preventDefault();
                var campos=[
                    'nombreCategoria',
                    'tarifa',
                   'sucursal'
                ];
                var url = "/categoria/guardar";
                var codigoCategoria = parseInt($("#codigoCategoria").val());
                var nombreCategoria = $("#nombreCategoria").val();
                var tarifa = parseFloat($("#tarifa").val());
                var codigoSucursal = parseInt($("#sucursal").val());

                var categoria = {
                    codigoCategoria: codigoCategoria,
                    nombreCategoria: nombreCategoria,
                    tarifa: tarifa,
                    sucursal : {
                        codigoSucursal : codigoSucursal
                    }
                };
                
                guardar(categoria, url, campos);
            });
        </script>
    </body>
</html>
