<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{layout/layout :: heat}"></head>
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <body class="login-page">
        <main class="login-layout">
            <section class="login-card" aria-labelledby="tituloLogin">
                <div class="login-brand">
                    <div class="login-brand-icon" aria-hidden="true">
                        <i class="fa-solid fa-recycle"></i>
                    </div>
                    <p class="login-brand-label">Sistema de gestión</p>
                    <h1>Recolección</h1>
                    <p class="login-brand-text">Administración de servicios, cobranzas y facturación.</p>
                </div>

                <div class="login-form-panel">
                    <div class="login-heading">
                        <h2 id="tituloLogin">Bienvenido</h2>
                        <p>Ingrese sus credenciales para continuar.</p>
                    </div>

                    <div th:if="${error}" class="mensaje-alerta alert alert-danger" role="alert">
                        <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
                        <span th:text="${error}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
                    </div>
                    <div th:if="${info}" class="mensaje-alerta alert alert-success" role="alert">
                        <i class="fa-solid fa-circle-check" aria-hidden="true"></i>
                        <span th:text="${info}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
                    </div>

                    <form th:action="@{/login}" method="post" class="login-form">
                        <div class="login-field">
                            <label for="username">Usuario</label>
                            <div class="login-input-wrap">
                                <i class="fa-solid fa-user" aria-hidden="true"></i>
                                <input type="text" name="username" id="username" class="form-control"
                                       placeholder="Ingrese su usuario" autocomplete="username" autofocus required>
                            </div>
                        </div>

                        <div class="login-field">
                            <label for="password">Contraseña</label>
                            <div class="login-input-wrap">
                                <i class="fa-solid fa-lock" aria-hidden="true"></i>
                                <input type="password" name="password" id="password" class="form-control"
                                       placeholder="Ingrese su contraseña" autocomplete="current-password" required>
                            </div>
                        </div>

                        <button type="submit" class="btn login-submit w-100">
                            <span>Iniciar sesión</span>
                            <i class="fa-solid fa-arrow-right-to-bracket" aria-hidden="true"></i>
                        </button>
                    </form>
                </div>
            </section>
            <p class="login-copyright">&copy; ALCMA Inc <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}"></span></p>
        </main>

        <footer th:replace="~{layout/layout :: footer}"></footer>
    </body>
</html>
