<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml" 
      xmlns:th="http://www.thymeleaf.org">
    <head  th:replace="~{layout/layout :: heat}"> </head>


    <div class=" my-5 mx-auto bg-color text-center  col-md-8 col-lg-6 col-xl-6 col-xxl-6">
        <div th:if="${error}" class="mensaje-alerta alert alert-danger">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div class="card-header">
            <h4>Por favor Inicie Sesion!</h4>
        </div>
        <div class="card-body text-center">
            <form  th:action="@{/login}" method="post">

                <div class="form-group  m-3">
                    <input type="text" name="username" id="username"
                           class="form-control" placeholder="Usuario" autofocus required />
                </div>

                <div class="form-group m-3">
                    <input type="password" name="password" id="password"
                           class="form-control" placeholder="contraseña" required />
                </div>

                <div class="form-group ">
                    <input type="submit" class="btn btn-lg btn-primary btn-block"
                           value=" Iniciar Sesion" />
                </div>
                <!--<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>-->

            </form>

        </div>

    </div>
    <footer  th:replace="~{layout/layout :: footer}"> </footer>

</body>
</html>
