<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <head th:replace="~{layout/layout :: heat}"> </head>

    <body>
        <header th:replace="~{layout/layout :: header}"> </header>
        <aside th:replace="~{layout/layout :: aside}"> </aside>

        </head>

        <body>
            <div class="container">
                <div class="form-title">
                    <h3 class="form-title">Sucursales</h3>
                </div>
                <div th:if="${info}" class="mensaje-alerta alert alert-success">
                    <span th:text="${info}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                <form th:if="${esRoot}" th:action="@{/sucursal/listar}" method="get"
                      class="row g-2 align-items-end mb-3">
                    <div class="col-md-6 col-lg-4">
                        <label for="filtroSucursal" class="form-label">Sucursal</label>
                        <select id="filtroSucursal" name="codigoSucursal" class="form-select">
                            <option th:each="opcion : ${sucursalesDisponibles}"
                                    th:value="${opcion.codigoSucursal}"
                                    th:text="|${opcion.codigoSucursal} - ${opcion.nombreSucursal}|"
                                    th:selected="${opcion.codigoSucursal == sucursalSeleccionada.codigoSucursal}"></option>
                        </select>
                    </div>
                    <div class="col-auto"><button type="submit" class="btn btn-primario">Filtrar</button></div>
                </form>
                <a sec:authorize="hasAuthority('ROOT')" th:href="@{/sucursal/agregar}" class="btn btn-primario m-2">Agregar</a>
                <div class="table-responsive-sm">
                    <table class="table table-border table-striped table-colapse table-hover table-lg ">
                        <thead class="bg-color">
                            <tr>
                                <th>Codigo sucursal</th>
                                <th>Sucursal</th>
                                <th>Ciudad</th>
                                <th>Celular</th>
                                <th>Telefono</th>
                                <th>Direccion</th>
                                <th sec:authorize="hasAnyAuthority('ROOT')">Acciones</th>
                            </tr>
                        </thead>
                        <tbody class="table-secondary">
                            <tr th:each="sucursal : ${sucursales}">
                                <td th:text="${sucursal.codigoSucursal}"> </td>
                                <td th:text="${sucursal.nombreSucursal}"> Mostrar Sucursal </td>
                                <td th:text="${sucursal.ciudad.nombreCiudad}"> Mostrar Ciudad </td>
                                <td th:text="${sucursal.celular}"> Mostrar celular </td>
                                <td th:text="${sucursal.telefono}"> Mostrar telefono
                                </td>
                                <td th:text="${sucursal.direccion}"> </td>
                                <td sec:authorize="hasAuthority('ROOT')">
                                    <a th:href="@{/sucursal/editar/} + ${sucursal.codigoSucursal}"
                                       class="btn btn-info btn-sm"  >
                                        <i class="fa-regular fa-pen-to-square"></i>
                                    </a>
                                    <a th:href="@{/sucursal/eliminar(codigoSucursal=${sucursal.codigoSucursal})}"
                                       class="btn btn-danger btn-sm "  >
                                        <i class="fa-solid fa-trash-can"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>


            </div>
            <footer th:replace="~{layout/layout :: footer}"> </footer>
        </body>

</html>
