# Perfil de produccion. Activar con SPRING_PROFILES_ACTIVE=prod.
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.servlet.session.timeout=${SESSION_TIMEOUT:120m}

# Base de datos: no incluir credenciales reales en este archivo.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.data-source-properties.connectionTimeZone=LOCAL
spring.datasource.hikari.connection-init-sql=SET time_zone = '-03:00'
spring.jackson.time-zone=America/Asuncion
spring.jpa.properties.hibernate.jdbc.time_zone=America/Asuncion
spring.datasource.hikari.pool-name=RecoleccionPool
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}

# Flyway es el unico responsable de modificar el esquema en produccion.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# La base de produccion actual ya contiene físicamente los cambios V1-V9.
# Al reiniciar el historial se toma V9 como linea base y se ejecuta V10.
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:9}
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.encoding=UTF-8

# En produccion Hibernate valida el esquema, pero nunca lo crea ni modifica.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
# Varias vistas existentes navegan relaciones LAZY durante el renderizado.
spring.jpa.open-in-view=${SPRING_JPA_OPEN_IN_VIEW:true}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true

# Rendimiento y registros.
spring.thymeleaf.cache=true
spring.main.banner-mode=off
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.pattern.dateformat=yyyy-MM-dd HH:mm:ss

# Exponer solamente comprobaciones basicas de operacion.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Cookies de sesion. SESSION_COOKIE_SECURE debe ser true cuando se sirve por HTTPS.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Capa base del mapa de recorridos. OpenStreetMap estándar no requiere API key.
# Puede reemplazarse mediante RECOLECCION_MAPAS_TILES_URL y
# RECOLECCION_MAPAS_ATTRIBUTION.
recoleccion.mapas.tiles-url=https://tile.openstreetmap.org/{z}/{x}/{y}.png
recoleccion.mapas.attribution=&copy; OpenStreetMap contributors
