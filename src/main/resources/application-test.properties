# Base histórica preparada para las pruebas locales.
spring.datasource.url=${TEST_DB_URL:jdbc:mysql://127.0.0.1:3307/recoleccion_test?useSSL=false&serverTimezone=America/Asuncion&allowPublicKeyRetrieval=true}
spring.datasource.hikari.data-source-properties.connectionTimeZone=LOCAL
spring.datasource.hikari.connection-init-sql=SET time_zone = '-03:00'
spring.jackson.time-zone=America/Asuncion
spring.jpa.properties.hibernate.jdbc.time_zone=America/Asuncion
spring.datasource.username=${TEST_DB_USERNAME:root}
spring.datasource.password=${TEST_DB_PASSWORD:1234}

# Esta rama anterior puede compartir la base de pruebas con ramas que ya aplicaron
# migraciones posteriores. Se ignoran solo esas migraciones ausentes localmente.
spring.flyway.ignore-migration-patterns=*:missing
# Esta rama anterior a SIFEN comparte una base de pruebas que puede contener
# migraciones versionadas de ramas posteriores.
spring.flyway.validate-on-migrate=false

