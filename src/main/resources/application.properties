#server.port=8080
#logging.level.root=info
logging.pattern.dateformat=hh:mm
spring.main.banner-mode=off
spring.thymeleaf.cache=false
#Mysql conexion
spring.datasource.url=jdbc:mysql://127.0.0.1:3307/recoleccion?useSSL=false&serverTimezone=America/Asuncion&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.data-source-properties.connectionTimeZone=LOCAL
spring.datasource.hikari.connection-init-sql=SET time_zone = '-03:00'
spring.jackson.time-zone=America/Asuncion
spring.jpa.properties.hibernate.jdbc.time_zone=America/Asuncion
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true

# Migraciones de base de datos. Las bases existentes se registran en la version 0
# y luego reciben solamente las migraciones versionadas pendientes.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.encoding=UTF-8
# La rama anterior comparte bases con desarrollo, donde pueden existir
# migraciones repetibles propias. No se relaja la validacion de las versionadas.
spring.flyway.ignore-migration-patterns=repeatable:missing

#spring.jpa.hibernate.ddl-auto=create-drop

#Mostrar sql
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
#logging.level.org.hibernate.orm.jdbc.bind=TRACE
#spring.jpa.open-in-view=false

#Configuracion de pool de conexiones
spring.datasource.hikari.minimum-idle: 5
spring.datasource.hikari.maximum-pool-size: 10
#spring.datasource.hikari.maximum-pool-size: 15 

# Factura electrónica (desactivada hasta configurar el ambiente TEST).
# Capa base del mapa de recorridos. Spring permite reemplazarla sin recompilar
# mediante RECOLECCION_MAPAS_TILES_URL y RECOLECCION_MAPAS_ATTRIBUTION.
recoleccion.mapas.tiles-url=https://tile.openstreetmap.org/{z}/{x}/{y}.png
recoleccion.mapas.attribution=&copy; OpenStreetMap contributors
