#server.port=8080
#logging.level.root=info
logging.pattern.dateformat=hh:mm
spring.main.banner-mode=off
spring.thymeleaf.cache=false
#Mysql conexion
spring.datasource.url=jdbc:mysql://127.0.0.1:3307/recoleccion_test?useSSL=false&serverTimezone=America/Asuncion&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true

#spring.jpa.hibernate.ddl-auto=create-drop

#Mostrar sql
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
#logging.level.org.hibernate.orm.jdbc.bind=TRACE
#spring.jpa.open-in-view=false

#Configuracion de pool de conexiones
spring.datasource.hikari.minimum-idle: 5
spring.datasource.hikari.maximum-pool-size: 10
#spring.datasource.hikari.maximum-pool-size: 15 

# Factura electrónica (desactivada hasta configurar el ambiente TEST).
recoleccion.sifen.enabled=${SIFEN_ENABLED:false}
recoleccion.sifen.ambiente=${SIFEN_AMBIENTE:TEST}
recoleccion.sifen.storage-root=${SIFEN_STORAGE_ROOT:./documentos/factura-electronica}
recoleccion.sifen.certificado=${SIFEN_CERTIFICADO:}
recoleccion.sifen.certificado-password=${SIFEN_CERTIFICADO_PASSWORD:}
recoleccion.sifen.csc-id=${SIFEN_CSC_ID:}
recoleccion.sifen.csc=${SIFEN_CSC:}
